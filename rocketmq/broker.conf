brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
# 本地单机开发使用 ASYNC_MASTER + ASYNC_FLUSH 降低磁盘等待；
# 生产环境追求零消息丢失时切换为 SYNC_MASTER + SYNC_FLUSH 并部署从节点（brokerId=1, SLAVE）。
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
brokerIP1 = 127.0.0.1
# RocketMQ 18级延迟消息默认配置：1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
