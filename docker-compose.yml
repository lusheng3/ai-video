services:
  mysql:
    image: mysql:8.0
    container_name: dovideo-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dovideo_ai}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: dovideo-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: dovideo-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  rmqnamesrv:
    image: apache/rocketmq:5.3.4
    container_name: dovideo-rmqnamesrv
    restart: unless-stopped
    ports:
      - "127.0.0.1:9876:9876"
    environment:
      JAVA_OPT_EXT: -server -Xms256m -Xmx256m -Xmn128m
    command: sh mqnamesrv

  rmqbroker:
    image: apache/rocketmq:5.3.4
    container_name: dovideo-rmqbroker
    restart: unless-stopped
    ports:
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10909:10909"
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
      JAVA_OPT_EXT: -server -Xms256m -Xmx256m -Xmn128m
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs
    command: sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/broker.conf
    depends_on:
      - rmqnamesrv

volumes:
  mysql-data:
  redis-data:
  minio-data:
  rocketmq-store:
  rocketmq-logs:
